---
- hosts: all
  roles:
    - name: base
      tags: ['base']
    - name: geerlingguy.docker
      tags: ['docker']
    - name: geerlingguy.pip
      tags: ['pip']
    - name: cloudalchemy.node_exporter
      tags: ['monitoring', 'node_exporter']
    - name: network
      tags: ['network', 'docker']
    - name: cadvisor
      tags: ['monitoring', 'cadvisor']

- hosts: prometheus
  roles:
    - name: prometheus
      tags: ['monitoring', 'prometheus']

- hosts: grafana
  roles:
    - name: grafana
      tags: ['monitoring', 'grafana']

- hosts: discourse
  roles:
    - name: postgres
      tags: ['postgres']
    - name: traefik
      tags: ['traefik']
    - name: discourse
      tags: ['discourse']
    - name: distrust
      tags: ['auth']
    - name: spotbot
      tags: ['spotbot']

- hosts: nextcloud
  roles:
    - name: nextcloud
      tags: ['nextcloud']
