---
- name: create traefik directories
  file:
    path: "{{item}}"
    state: directory
  with_items:
    - "/var/traefik/"
    - "/var/traefik/acme"
    - "/var/traefik/conf.d"

- name: configure traefik
  template:
    src: "templates/traefik.yaml"
    dest: "/var/traefik/traefik.yaml"
  notify: restart_traefik

- import_role:
    name: cloudflight.systemd_service
