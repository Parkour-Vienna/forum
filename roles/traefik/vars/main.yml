---
systemd_service:
  name: traefik
  state: started
  enabled: yes
  docker:
    container_name: traefik
    image: docker.io/library/traefik:{{traefik_version}}
    network: '{{ docker_network_name }}'
    expose_port:
      - host: 80
        container: 80
      - host: 443
        container: 443
      - host: 8080
        container: 8080
    volume:
      - host: "/var/traefik/"
        container: /etc/traefik/
        mode: rw
      - host: "/var/run/docker.sock"
        container: /var/run/docker.sock
        mode: rw
    memory_limit: 100m
