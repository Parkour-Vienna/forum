---
- hosts: all
  roles:
    - name: base
      tags: ['base']
    - name: geerlingguy.pip
      tags: ['pip']
    - name: network
      tags: ['network', 'docker']
    - name: grafana-agent
      tags: ['o11y']

- hosts: infrastructure
  roles:
    - name: postgres
      tags: ['postgres']
    - name: traefik
      tags: ['traefik']

- hosts: apps
  roles:
    - name: nextcloud
      tags: ['nextcloud']
    - name: discourse
      tags: ['discourse']
    - name: distrust
      tags: ['distrust','auth']
    - name: spotbot
      tags: ['spotbot']
    - name: gts
      tags: ['gotosocial']
