---
postgres_password: '{{ vault_postgres_password }}'
postgres_user: 'discourse'
postgres_db: 'discourse'

gotosocial:
  host: 'social.parkour.wien'
  domain: 'parkour.wien'
  db_password: '{{ vault_gts_db_password }}'
  oidc_secret: '3DNCOJkwfEV9pWK3qOgVmTkZLvHeILvv'

discourse:
  site_domain: parkour.wien
  admin_emails: '{{ vault_admin_emails }}'
  database:
    user: 'discourse'
    password: '{{ vault_discourse_db_password }}'
  smtp:
    address: smtp.eu.mailgun.org
    username: pkv@mg.parkour.wien
    password: '{{ vault_smtp_password }}'

nextcloud:
  host: 'drive.parkour.wien'

distrust:
  host: 'auth.parkour.wien'
  server: 'https://{{ discourse.site_domain }}'
  secret: '{{ vault_distrust_secret }}'
  oidc:
    secret: '{{ vault_distrust_oidc_secret }}'
    privateKey: '{{ vault_distrust_oidc_privateKey }}'
  clients:
    nextcloud:
      secret: '{{ vault_distrust_nextcloud_secret }}'
      allowGroups:
        - team
      redirectURIs:
        - 'https://{{ nextcloud.host }}/apps/oidc_login/oidc'
    social.parkour.wien:
      allowGroups:
        - team
      redirectURIs: ['https://social.parkour.wien/auth/callback']
      secret: '{{ vault_distrust_gts_secret }}'

acme_email: '{{ vault_acme_email }}'
