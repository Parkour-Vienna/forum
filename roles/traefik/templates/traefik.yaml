entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: "websecure"
          scheme: "https"

  websecure:
    address: ":443"

providers:
  docker:
    network: "{{ docker_network_name }}"

certificatesResolvers:
  default:
    acme:
      email: "{{ acme_email }}"
      storage: "/etc/traefik/acme/acme.json"
      tlsChallenge: {}
accessLog: {}
